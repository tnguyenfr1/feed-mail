<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<title>Feed Mail</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Feed Mail">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
  --bg: #f6f7fb; --card: #ffffff; --ink: #161a23; --muted: #6b7280; --line: #e5e7ee;
  --accent: #3b6cf6; --accent-ink: #ffffff; --danger: #d64545; --unread: #3b6cf6; --ok: #15803d;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318; --card: #1a1d24; --ink: #e8eaf0; --muted: #9aa1ad; --line: #2a2e38;
    --accent: #6b8eff; --accent-ink: #0b0d12; --danger: #ff6b6b; --unread: #7c9bff; --ok: #4ade80;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--ink); }
.hidden, [hidden] { display: none !important; }

/* ---------- login ---------- */
#login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.login-box {
  width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line);
  border-radius: 20px; padding: 28px 24px; box-shadow: var(--shadow);
}
.login-box h1 { margin: 0 0 4px; font-size: 24px; }
.login-box p { margin: 0 0 18px; color: var(--muted); }

.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select, textarea {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); outline: none;
}
.field input:focus, .field select:focus, textarea:focus { border-color: var(--accent); }
.btn {
  border: 0; border-radius: 10px; padding: 10px 16px; background: var(--accent);
  color: var(--accent-ink); font-weight: 600;
}
.btn:disabled { opacity: .6; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); font-weight: 500; }
.btn.wide { width: 100%; }
.err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0 8px; }

/* ---------- layout ---------- */
#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
.feed-col { min-width: 0; }
.chips { touch-action: pan-x pan-y; }
@media (min-width: 960px) { #app { grid-template-columns: minmax(380px, 440px) 1fr; } }
.feed-col { display: flex; flex-direction: column; min-height: 0; height: 100%; border-right: 1px solid var(--line); }

header.top {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
}
header.top h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: -.01em; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); display: grid; place-items: center;
}
.icon-btn svg { width: 20px; height: 20px; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.chips { display: flex; gap: 8px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; display: flex; align-items: center; gap: 6px;
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .count { opacity: .7; }

.banner { margin: 0 16px 10px; padding: 10px 12px; border-radius: 10px; font-size: 13px;
  background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }

#feed { flex: 1; overflow-y: auto; padding: 0 12px 24px; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
#ptr { height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px;
  font-weight: 600; color: var(--accent); transition: height .15s ease-out; flex: none; }
.ptr-spin { display: inline-block; font-size: 18px; animation: spin 1s linear infinite; }
html, body { overscroll-behavior-y: none; }
.day { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); padding: 14px 6px 6px; }
.card {
  position: relative; display: block; width: 100%; text-align: left; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 12px 18px;
  margin-bottom: 8px; box-shadow: var(--shadow); overflow: hidden;
}
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--acct); }
.card.active { outline: 2px solid var(--accent); outline-offset: -1px; }
.card .row { display: flex; align-items: center; gap: 10px; }
.avatar {
  flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: 14px; color: #fff; background: var(--acct);
}
.who { flex: 1; min-width: 0; }
.who .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .acct { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.when { flex: none; font-size: 12px; color: var(--muted); }
.subject { margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preview { color: var(--muted); font-size: 14px; margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.unread .subject { font-weight: 700; }
.card.unread .name::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--unread); margin-left: 6px; vertical-align: middle; }
.tags { display: inline-flex; gap: 4px; margin-left: 4px; color: var(--muted); font-size: 12px; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }

/* ---------- reader ---------- */
#reader { display: none; flex-direction: column; min-height: 0; height: 100%; background: var(--bg); }
#reader.open { display: flex; }
@media (max-width: 959px) {
  #reader { position: fixed; inset: 0; z-index: 10; }
}
@media (min-width: 960px) {
  #reader { display: flex; }
  #reader .back { display: none; }
}
.reader-top { display: flex; align-items: center; gap: 8px; padding: 8px 16px;
  padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); }
.reader-top .spacer { flex: 1; }
.reader-body { flex: 1; overflow-y: auto; padding: 12px 16px; -webkit-overflow-scrolling: touch; }
.reader-inner { max-width: 960px; margin: 0 auto; }
.reader-body h2 { margin: 0 0 10px; font-size: 20px; line-height: 1.3; }
.meta { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.meta .lines { flex: 1; min-width: 0; font-size: 14px; }
.meta .lines .muted { color: var(--muted); word-break: break-word; }
.msg-frame-wrap { background: #fff; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
.msg-frame { width: 100%; border: 0; display: block; min-height: 120px; }
.msg-text { white-space: pre-wrap; word-break: break-word; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 16px; }
.msg-text a { color: var(--accent); }
.img-note { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px;
  color: var(--muted); margin-bottom: 10px; }
.atts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.att { display: inline-flex; gap: 6px; align-items: center; padding: 8px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--card); color: var(--ink); text-decoration: none; font-size: 13px; }
.reader-placeholder { flex: 1; display: grid; place-items: center; color: var(--muted); }

.composer { border-top: 1px solid var(--line); background: var(--card); padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom)); }
.composer textarea { min-height: 110px; resize: vertical; background: var(--bg); }
.composer .actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.composer .actions .to { flex: 1; font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- settings sheet ---------- */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: grid; place-items: end center; }
@media (min-width: 640px) { .sheet-back { place-items: center; } }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: var(--card);
  border-radius: 20px 20px 0 0; padding: 20px 16px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
@media (min-width: 640px) { .sheet { border-radius: 20px; padding: 24px; } }
@media (max-width: 639px) {
  /* On phones the Accounts panel is a full-screen page with a normal scroll. */
  .sheet-back { place-items: stretch; background: var(--card); }
  .sheet { max-width: none; height: 100%; max-height: none; border-radius: 0;
    padding-top: max(12px, env(safe-area-inset-top)); }
  .sheet > div:first-child { position: sticky; top: calc(-1 * max(12px, env(safe-area-inset-top))); background: var(--card);
    margin: 0 -16px; padding: 8px 16px; z-index: 1; border-bottom: 1px solid var(--line); }
}
.sheet { overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.sheet h2 { margin: 0 0 4px; font-size: 20px; }
.sheet h3 { margin: 20px 0 10px; font-size: 15px; }
.sheet .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.acct-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.acct-row .info { flex: 1; min-width: 0; }
.acct-row .info div:last-child { font-size: 13px; color: var(--muted); }
.colors { display: flex; gap: 8px; flex-wrap: wrap; }
.colors button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; }
.colors button.on { border-color: var(--ink); }
.hint { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
/* ---------- calendar panel ---------- */
.reader-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.reader-grid .cal { order: -1; }
@media (max-width: 959px) { .focus-btn { display: none; } }
#reader .back.keep { display: grid; }
#app.focus { grid-template-columns: 1fr; }
#app.focus .feed-col { display: none; }
#app.focus .reader-inner { max-width: 1100px; }
.cal .cal-body { max-height: 320px; overflow-y: auto; }
.cal { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.cal > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.cal > summary::-webkit-details-marker { display: none; }
.cal > summary .sum-sub { font-weight: 400; color: var(--muted); font-size: 13px; flex: 1; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal > summary .sum-sub.clash { color: var(--danger); font-weight: 600; }
.cal-body { padding: 0 14px 14px; }
.cal-days { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.cal-days .chip { padding: 4px 10px; font-size: 12px; }
.cal-days .chip small { opacity: .7; }
.cal-nav { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.cal-nav b { flex: 1; font-size: 14px; }
.cal-nav button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; width: 30px; height: 30px; }
.ev { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ev:first-child { border-top: 0; }
.ev .bar { width: 4px; border-radius: 2px; background: var(--acct); flex: none; }
.ev .t { flex: none; width: 92px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.ev .what { flex: 1; min-width: 0; }
.ev .what div:last-child { color: var(--muted); font-size: 12px; }
.ev.clash .t, .ev.clash .what > div:first-child { color: var(--danger); }
.ev.clash .what > div:first-child::after { content: " · clash"; font-size: 12px; font-weight: 600; }
.ev.free { color: var(--muted); }
.invite { border: 2px dashed var(--accent); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; }
.invite .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.invite .ttl { font-weight: 600; margin: 2px 0; }
.invite .muted { color: var(--muted); font-size: 13px; }
.invite .rsvp { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.invite .rsvp .btn { padding: 7px 12px; font-size: 13px; }
.cal-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.cal-note.bad { color: var(--danger); }
.files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.files:empty { display: none; }
.files .f { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px 5px 10px; border: 1px solid var(--line);
  border-radius: 8px; font-size: 13px; background: var(--bg); max-width: 100%; }
.files .f span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.files .f button { border: 0; background: none; padding: 0 2px; color: var(--muted); font-size: 15px; line-height: 1; }
.rp { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--ok);
  background: color-mix(in srgb, var(--ok) 14%, transparent); border-radius: 999px; padding: 2px 8px; margin-right: 6px; vertical-align: 1px; }
.replied-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--ok); font-weight: 600;
  background: color-mix(in srgb, var(--ok) 10%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
  border-radius: 10px; padding: 8px 12px; margin-bottom: 14px; }
.replied-bar .btn { padding: 4px 10px; font-size: 13px; }
.my-reply { flex-basis: 100%; white-space: pre-wrap; word-break: break-word; color: var(--ink); font-weight: 400;
  border-left: 3px solid var(--ok); padding: 4px 0 4px 10px; margin-top: 4px; }
/* ---------- view toggle + conversation ---------- */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 7px 10px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); }
/* The header must always fit: the title gives way first, buttons never get pushed off. */
header.top h1 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header.top .seg, header.top .icon-btn { flex: none; }
.seg .short { display: none; }
@media (max-width: 520px) {
  .seg .long { display: none; }
  .seg .short { display: inline; }
  .seg button { padding: 7px 9px; font-size: 12px; }
  header.top { gap: 6px; padding-left: 12px; padding-right: 12px; }
  header.top h1 { font-size: 19px; }
  .icon-btn { width: 38px; height: 38px; }
}
@media (max-width: 340px) { header.top h1 { display: none; } header.top .seg { margin-right: auto; } }
.cnt { display: inline-block; font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line);
  border-radius: 999px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
.tmsg { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
.tmsg.mine { background: color-mix(in srgb, var(--accent) 6%, var(--card)); }
.tmsg.target { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.tm-head { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; cursor: pointer; }
.tm-head .avatar { width: 32px; height: 32px; font-size: 12px; }
.tm-who { flex: 1; min-width: 0; font-size: 14px; }
.tm-who .muted, .tm-to { color: var(--muted); font-size: 13px; }
.tm-prev { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm-when { flex: none; font-size: 12px; color: var(--muted); }
.tm-body { padding: 0 12px 4px; }
.tm-to { margin-bottom: 10px; word-break: break-word; }
.tm-actions { display: flex; gap: 8px; padding: 6px 12px 12px; flex-wrap: wrap; align-items: center; }
.tm-actions .btn { padding: 6px 12px; font-size: 13px; }
.tm-actions .spacer { flex: 1; }
.composer.collapsed { padding-top: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.composer.collapsed .reply-target, .composer.collapsed textarea, .composer.collapsed .files, .composer.collapsed .actions { display: none; }
.composer:not(.collapsed) .reply-stub { display: none; }
.reply-stub { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--muted);
  border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.reply-target { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent); margin-bottom: 6px; }
.reply-target:empty { display: none; }
.reply-target span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reply-target .x { border: 0; background: none; color: var(--muted); font-size: 15px; padding: 0 4px; }
/* Nothing inside an open email may push the page wider than the screen. */
html, body { overflow-x: hidden; }
.reader-grid { grid-template-columns: minmax(0, 1fr) !important; }
.msg-col, .tmsg, .tm-body, .msg-frame-wrap { min-width: 0; max-width: 100%; }
.msg-text, .tm-who b, .tm-to, .reader-body h2 { overflow-wrap: anywhere; }
@media (max-width: 600px) {
  .reader-body { padding: 10px 8px; }
  .tm-body { padding: 0 8px 4px; }
  .tm-head { padding: 10px 8px; }
  .tm-actions { padding: 6px 8px 10px; }
  .reader-top .btn { padding: 8px 10px; font-size: 13px; }
}
.ag-day { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
.ag-day.today { border-color: var(--accent); }
.ag-day.free { padding-top: 8px; padding-bottom: 8px; }
.ag-date { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.ag-day.today .ag-date { color: var(--accent); }
.ag-free { color: var(--muted); font-size: 13px; }
.ag-date + .ev { border-top: 0; }
/* ---------- compose ---------- */
.feed-col { position: relative; }
.fab { position: absolute; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5;
  display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 16px; padding: 14px 18px;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.fab svg { width: 20px; height: 20px; }
#feed { padding-bottom: 88px; }
.compose .cf { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding: 4px 0; }
.compose .cf > span { flex: none; width: 60px; color: var(--muted); font-size: 14px; }
.compose .cf input, .compose .cf select { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; outline: none; font-size: 15px; }
.compose .cf select option { background: var(--card); }
.compose .cc-toggle { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 4px 0; flex: none; }
.compose textarea { width: 100%; min-height: 260px; border: 0; background: none; padding: 14px 0; resize: vertical; outline: none; font-size: 15px; line-height: 1.5; }
.compose .c-bottom { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; z-index: 30; font-size: 14px; max-width: calc(100% - 32px); }
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <h1>Feed Mail</h1>
    <p id="loginSub">All your inboxes in one feed.</p>
    <label class="field"><span id="pwLabel">Password</span>
      <input type="password" id="pw" autocomplete="current-password" required></label>
    <label class="field hidden" id="pw2Wrap"><span>Repeat password</span>
      <input type="password" id="pw2" autocomplete="new-password"></label>
    <div class="err" id="loginErr"></div>
    <button class="btn wide" id="loginBtn">Log in</button>
  </form>
</div>

<div id="app" class="hidden">
  <section class="feed-col">
    <header class="top">
      <h1>Feed</h1>
      <div class="seg" id="viewToggle" role="group" aria-label="View">
        <button data-v="conv" title="Conversations"><span class="long">Conversations</span><span class="short">Threads</span></button><button data-v="all" title="Every email">All</button>
      </div>
      <button class="icon-btn" id="calBtn" title="Calendar" aria-label="Calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Accounts" aria-label="Accounts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>
    <div class="chips" id="chips"></div>
    <div id="banners"></div>
    <div id="ptr" aria-live="polite"></div>
    <div id="feed"></div>
    <button class="fab" id="composeBtn" aria-label="New email" title="New email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span>New email</span>
    </button>
  </section>

  <section id="reader">
    <div class="reader-placeholder" id="readerEmpty">Pick an email from the feed</div>
  </section>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['#3b6cf6', '#7c3aed', '#db2777', '#ea580c', '#16a34a', '#0891b2', '#ca8a04', '#64748b'];

const state = { accounts: [], items: [], status: {}, filter: 'all', current: null, loading: false };

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401 && path !== '/login') { showLogin(); throw new Error('Not logged in'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.append(t);
  setTimeout(() => t.remove(), 3000);
}

// ---------- login ----------
let setupMode = false;
function showLogin() {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
}
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = $('#pw').value;
  $('#loginErr').textContent = '';
  if (setupMode && pw !== $('#pw2').value) { $('#loginErr').textContent = 'The two passwords differ.'; return; }
  $('#loginBtn').disabled = true;
  try {
    await api(setupMode ? '/setup' : '/login', { method: 'POST', body: { password: pw } });
    $('#pw').value = $('#pw2').value = '';
    startApp();
  } catch (err) { $('#loginErr').textContent = err.message; }
  $('#loginBtn').disabled = false;
});

async function boot() {
  const s = await api('/session');
  if (s.loggedIn) return startApp();
  setupMode = s.setup;
  if (setupMode) {
    $('#loginSub').textContent = 'Welcome! Choose a password for this app. You will use it on every device.';
    $('#pwLabel').textContent = 'New password (8+ characters)';
    $('#pw').autocomplete = 'new-password';
    $('#pw2Wrap').classList.remove('hidden');
    $('#loginBtn').textContent = 'Create password';
  }
  showLogin();
  $('#pw').focus();
}

async function startApp() {
  const params = new URLSearchParams(location.search);
  if (params.has('added')) toast(`Connected ✓ ${params.get('added')}`);
  if (params.has('oauthError')) toast(params.get('oauthError'));
  if (location.search) history.replaceState(null, '', '/');
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  state.accounts = await api('/accounts');
  renderChips();
  if (!state.current) showIdleReader();
  if (!state.accounts.length) { renderFeed(); openSettings(); return; }
  loadFeed();
}

// ---------- feed ----------
const acctOf = (id) => state.accounts.find((a) => a.id === id) || { color: '#888', email: '?' };
const acctLabel = (a) => a.name || a.email;

async function loadFeed(force = false) {
  if (state.loading) return;
  state.loading = true;
  $('#refreshBtn').classList.add('spin');
  try {
    const data = await api('/feed' + (force ? '?refresh=1' : ''));
    state.items = data.items; state.status = data.status;
    renderChips(); renderFeed();
    // Some inbox was still refreshing on the Pi: pick up its news shortly.
    if (Object.values(data.status).some((x) => x.loading)) setTimeout(() => loadFeed(), 4000);
  } catch (err) { if (err.message !== 'Not logged in') toast(err.message); }
  state.loading = false;
  $('#refreshBtn').classList.remove('spin');
}

function renderChips() {
  const unread = (id) => state.items.filter((i) => !i.seen && (id === 'all' || i.acct === id)).length;
  const chip = (id, label, color) => {
    const n = unread(id);
    return `<button class="chip ${state.filter === id ? 'on' : ''}" data-f="${id}">
      ${color ? `<span class="dot" style="background:${color}"></span>` : ''}${esc(label)}${n ? ` <span class="count">${n}</span>` : ''}</button>`;
  };
  // Chips stay short: the account's name, or the part of the address before the @.
  $('#chips').innerHTML = chip('all', 'All') + state.accounts.map((a) => chip(a.id, a.name || a.email.split('@')[0], a.color)).join('');
  const errs = state.accounts.filter((a) => state.status[a.id]?.error);
  $('#banners').innerHTML = errs.map((a) => `<div class="banner"><b>${esc(acctLabel(a))}:</b> ${esc(state.status[a.id].error)}</div>`).join('');
}
$('#chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.filter = b.dataset.f; renderChips(); renderFeed();
});

function initials(from) {
  const s = (from?.name || from?.address || '?').replace(/["']/g, '').trim();
  const parts = s.split(/[\s@._-]+/).filter(Boolean);
  return ((parts[0]?.[0] || '?') + (parts[1]?.[0] || '')).toUpperCase();
}

function fmtWhen(iso) {
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (now - d < 6 * 864e5) return d.toLocaleDateString([], { weekday: 'short' });
  return d.toLocaleDateString([], { day: 'numeric', month: 'short', ...(d.getFullYear() !== now.getFullYear() && { year: 'numeric' }) });
}

function dayLabel(iso) {
  const d = new Date(iso), now = new Date();
  const days = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  if (days < 7) return d.toLocaleDateString([], { weekday: 'long' });
  return d.toLocaleDateString([], { day: 'numeric', month: 'long', year: 'numeric' });
}

// ---------- feed (conversations or every email) ----------
const viewKey = 'fm_view';
try { state.view = localStorage.getItem(viewKey) || 'conv'; } catch { state.view = 'conv'; }

function setView(v) {
  state.view = v;
  try { localStorage.setItem(viewKey, v); } catch {}
  $('#viewToggle').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  renderFeed();
}

// Turn the flat list of inbox emails into feed entries.
function feedEntries() {
  const items = state.items.filter((i) => state.filter === 'all' || i.acct === state.filter);
  if (state.view !== 'conv') return items.map((it) => ({ key: it.id, latest: it, items: [it] }));
  const groups = new Map();
  for (const it of items) {
    const k = `${it.acct}|${it.thread || it.uid}`;
    if (!groups.has(k)) groups.set(k, { key: 'c:' + k, items: [] });
    groups.get(k).items.push(it);
  }
  const out = [...groups.values()];
  for (const g of out) {
    g.items.sort((a, b) => (a.date < b.date ? 1 : -1));
    g.latest = g.items[0];
  }
  return out.sort((a, b) => (a.latest.date < b.latest.date ? 1 : -1));
}

const shortName = (p) => (p?.name || p?.address || '?').split(/[\s@]/)[0];

function renderFeed() {
  if (!state.accounts.length) {
    $('#feed').innerHTML = `<div class="empty">No accounts yet.<br><br><button class="btn" onclick="openSettings()">Add an email account</button></div>`;
    return;
  }
  const entries = feedEntries();
  if (!entries.length) { $('#feed').innerHTML = `<div class="empty">${state.loading ? 'Loading…' : 'Nothing here.'}</div>`; return; }
  let html = '', lastDay = '';
  for (const g of entries) {
    const it = g.latest;
    const day = dayLabel(it.date);
    if (day !== lastDay) { html += `<div class="day">${esc(day)}</div>`; lastDay = day; }
    const a = acctOf(it.acct);
    const unread = g.items.some((x) => !x.seen);
    const mine = state.view === 'conv' ? it.threadSent : null;
    const count = g.items.length + (mine?.count || 0);
    const active = state.current && state.current.key === g.key;
    // Replied: my latest message in the conversation is newer than theirs.
    const repliedAt = mine?.lastAt && mine.lastAt > it.date ? mine.lastAt : it.replied ? it.replied.at || '' : null;
    const people = state.view === 'conv' && count > 1
      ? [...new Set([...g.items.map((x) => shortName(x.from)), ...(mine ? ['me'] : [])])].slice(0, 3).join(', ')
      : (it.from?.name || it.from?.address || 'Unknown');
    html += `<button class="card ${unread ? 'unread' : ''} ${active ? 'active' : ''}" style="--acct:${a.color}" data-key="${esc(g.key)}">
      <div class="row">
        <div class="avatar">${esc(initials(it.from))}</div>
        <div class="who"><div class="name">${esc(people)}${count > 1 ? ` <span class="cnt">${count}</span>` : ''}</div>
          <div class="acct">to ${esc(acctLabel(a))}</div></div>
        <div class="when">${esc(fmtWhen(it.date))}</div>
      </div>
      <div class="subject">${repliedAt !== null ? `<span class="rp">↩ Replied${repliedAt ? ' · ' + esc(fmtWhen(repliedAt)) : ''}</span>` : ''}${esc(it.subject)}<span class="tags">${g.items.some((x) => x.attach) ? '📎' : ''}</span></div>
      ${it.preview ? `<div class="preview">${esc(it.preview)}</div>` : ''}
    </button>`;
  }
  $('#feed').innerHTML = html;
}
$('#feed').addEventListener('click', (e) => {
  const c = e.target.closest('.card'); if (!c) return;
  const g = feedEntries().find((x) => x.key === c.dataset.key);
  if (g) openConversation(g);
});

// ---------- reader: a conversation (one or more messages) ----------
const linkify = (s) => esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const fmtAddr = (a) => a ? (a.name ? `${a.name} <${a.address}>` : a.address) : '';
const fmtSize = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const fmtLong = (iso) => new Date(iso).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const msgUrl = (m, extra = '') => `/msg/${m.acct}/${encodeURIComponent(m.uid)}${extra}${m.box === 'sent' ? '?box=sent' : ''}`;

// Opening an email or the Accounts sheet adds a history step, so the phone's
// back gesture/button closes it instead of leaving the app.
function pushLayer(name) {
  if (history.state?.fm !== name) history.pushState({ fm: name }, '');
}
function popLayer(name) {
  if (history.state?.fm === name) history.back(); // the popstate handler closes it
  else return true;
}
// A "guard" step under the feed: the first back on the feed only warns,
// a second one within 2 seconds leaves the app.
let leaveWarnedAt = 0;
if (history.state?.fm !== 'guard') history.replaceState({ fm: 'root' }, '');
if (history.state?.fm === 'root') history.pushState({ fm: 'guard' }, '');
window.addEventListener('popstate', () => {
  const sheet = $('.sheet-back');
  if (sheet && history.state?.fm !== 'sheet') { sheet._close?.(true); return; }
  if (state.current && history.state?.fm !== 'reader') { closeReader(true); return; }
  if (history.state?.fm === 'root') {
    if (Date.now() - leaveWarnedAt < 2000) { history.back(); return; }
    leaveWarnedAt = Date.now();
    toast('Swipe back again to close Feed Mail');
    history.pushState({ fm: 'guard' }, '');
  }
});

async function openConversation(g) {
  const latest = g.latest;
  const conv = { key: g.key, acct: latest.acct, msgs: [], target: null, calSet: false };
  if (window.innerWidth < 960) pushLayer('reader');
  state.current = conv;
  const r = $('#reader');
  r.classList.add('open');
  r.innerHTML = `<div class="reader-top"><button class="icon-btn back" aria-label="Back">←</button><div class="spacer"></div></div>
    <div class="reader-body"><div class="reader-inner"><p style="color:var(--muted)">Loading…</p></div></div>`;
  $('.back', r).onclick = () => closeReader();
  const wasUnread = g.items.filter((x) => !x.seen);
  for (const x of g.items) x.seen = true;
  renderChips(); renderFeed();

  // Start loading the newest message while the conversation list loads.
  conv.prefetch = { uid: latest.uid, promise: api(msgUrl({ ...latest, box: 'inbox' })).catch((err) => ({ error: err.message })) };
  let list = g.items.slice().reverse().map((x) => ({ ...x, box: 'inbox' }));
  if (state.view === 'conv' && (g.items.length > 1 || latest.threadSent)) {
    try { list = await api(`/thread/${latest.acct}/${encodeURIComponent(latest.thread)}`); } catch {}
  }
  if (state.current !== conv) return;
  const unreadUids = new Set(wasUnread.map((x) => x.uid));
  conv.msgs = list.map((m, i) => ({
    meta: m, full: null, showImages: false,
    open: i === list.length - 1 || (m.box === 'inbox' && unreadUids.has(m.uid)),
  }));
  conv.target = conv.msgs[conv.msgs.length - 1];
  renderConversation(conv);
}

try { state.focus = localStorage.getItem('fm_focus') === '1'; } catch { state.focus = false; }

function applyFocus() {
  $('#app').classList.toggle('focus', state.focus && !!state.current && window.innerWidth >= 960);
  const b = $('.focus-btn');
  if (b) b.textContent = state.focus ? '⤡ Show feed' : '⤢ Focus';
}
function toggleFocus() {
  state.focus = !state.focus;
  try { localStorage.setItem('fm_focus', state.focus ? '1' : '0'); } catch {}
  applyFocus();
}
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || !state.current) return;
  if (document.activeElement?.tagName === 'TEXTAREA' || document.activeElement?.tagName === 'INPUT') return;
  if (state.focus) toggleFocus(); else closeReader();
});
window.addEventListener('resize', () => applyFocus());

function closeReader(fromHistory = false) {
  if (!fromHistory && !popLayer('reader')) return;
  state.current = null;
  applyFocus();
  $('#reader').classList.remove('open');
  showIdleReader();
  renderFeed();
}

// With no email open, a computer's right-hand side shows the calendar.
function showIdleReader() {
  if (window.innerWidth >= 960 && state.accounts.some((a) => a.calendar)) renderAgenda($('#reader'), { embedded: true });
  else $('#reader').innerHTML = `<div class="reader-placeholder">Pick an email from the feed</div>`;
}

// ---------- compose a new email ----------

// Addresses seen in the feed, for suggestions while typing recipients.
function contactSuggestions() {
  const mine = new Set(state.accounts.map((a) => a.email.toLowerCase()));
  const seen = new Map();
  for (const it of state.items) {
    for (const p of [it.from, ...(it.to || [])]) {
      if (!p?.address) continue;
      const k = p.address.toLowerCase();
      if (mine.has(k) || seen.has(k)) continue;
      seen.set(k, p.name ? `${p.name.replace(/[<>",]/g, '')} <${p.address}>` : p.address);
    }
  }
  return [...seen.values()];
}

function defaultFrom() {
  if (state.filter !== 'all' && state.accounts.some((a) => a.id === state.filter)) return state.filter;
  let last = null;
  try { last = localStorage.getItem('fm_from'); } catch {}
  return state.accounts.some((a) => a.id === last) ? last : state.accounts[0]?.id;
}

function openCompose() {
  if (!state.accounts.length) return openSettings();
  if (window.innerWidth < 960) pushLayer('reader');
  state.current = { key: 'compose', compose: true };
  applyFocus();
  const d = state.draft || (state.draft = { acct: defaultFrom(), to: '', cc: '', bcc: '', subject: '', body: '', files: [], showCc: false });
  const r = $('#reader');
  r.classList.add('open');
  const contacts = contactSuggestions();
  r.innerHTML = `
    <div class="reader-top">
      <button class="icon-btn back keep" aria-label="Close (the draft is kept)" title="Close (the draft is kept)">←</button>
      <b style="font-size:17px">New email</b><div class="spacer"></div>
      <button class="btn danger" data-c="discard">Discard</button>
      <button class="btn" data-c="send">Send</button>
    </div>
    <div class="reader-body"><div class="reader-inner compose">
      <label class="cf"><span>From</span><select name="acct">${state.accounts.map((a) =>
        `<option value="${a.id}" ${a.id === d.acct ? 'selected' : ''}>${esc(a.name ? `${a.name} (${a.email})` : a.email)}</option>`).join('')}</select></label>
      <div class="cf"><span>To</span><input name="to" list="dl-to" autocomplete="off" inputmode="email" value="${esc(d.to)}">
        <button class="cc-toggle" data-c="cc" ${d.showCc ? 'hidden' : ''}>Cc/Bcc</button></div>
      <label class="cf" ${d.showCc ? '' : 'hidden'} data-ccrow><span>Cc</span><input name="cc" list="dl-cc" autocomplete="off" inputmode="email" value="${esc(d.cc)}"></label>
      <label class="cf" ${d.showCc ? '' : 'hidden'} data-ccrow><span>Bcc</span><input name="bcc" list="dl-bcc" autocomplete="off" inputmode="email" value="${esc(d.bcc)}"></label>
      <label class="cf"><span>Subject</span><input name="subject" autocomplete="off" value="${esc(d.subject)}"></label>
      <textarea name="body" placeholder="Write your email…">${esc(d.body)}</textarea>
      <div class="files" id="cFiles"></div>
      <div class="c-bottom">
        <label class="btn ghost" style="padding:8px 12px">📎 Attach<input type="file" id="cFileInput" multiple hidden></label>
        <span class="spacer" style="flex:1"></span>
        <button class="btn" data-c="send">Send</button>
      </div>
      <datalist id="dl-to"></datalist><datalist id="dl-cc"></datalist><datalist id="dl-bcc"></datalist>
    </div></div>`;
  $('.back', r).onclick = () => closeReader();

  const renderFiles = () => {
    $('#cFiles').innerHTML = d.files.map((f, i) => `<div class="f"><span>📎 ${esc(f.name)}</span> <small style="color:var(--muted)">${fmtSize(f.size)}</small><button data-rm="${i}" aria-label="Remove">×</button></div>`).join('');
  };
  renderFiles();
  $('#cFileInput').addEventListener('change', (e) => {
    for (const f of e.target.files) d.files.push(f);
    e.target.value = '';
    if (d.files.reduce((n, f) => n + f.size, 0) > 20 * 1024 * 1024) toast('Attachments are over 20 MB in total; most mail servers will refuse them.');
    renderFiles();
  });
  $('#cFiles').addEventListener('click', (e) => {
    const x = e.target.closest('[data-rm]'); if (!x) return;
    d.files.splice(Number(x.dataset.rm), 1); renderFiles();
  });

  // Keep the draft as you type; suggest addresses for the part after the last comma.
  r.querySelectorAll('input[name], select[name], textarea[name]').forEach((el) => {
    el.addEventListener('input', () => {
      d[el.name] = el.value;
      if (el.name === 'acct') { try { localStorage.setItem('fm_from', el.value); } catch {} }
      if (['to', 'cc', 'bcc'].includes(el.name)) {
        const cut = el.value.lastIndexOf(',');
        const prefix = cut >= 0 ? el.value.slice(0, cut + 1).trimEnd() + ' ' : '';
        const term = el.value.slice(cut + 1).trim().toLowerCase();
        const hits = term.length < 2 ? [] : contacts.filter((c) => c.toLowerCase().includes(term)).slice(0, 8);
        $('#dl-' + el.name).innerHTML = hits.map((c) => `<option value="${esc(prefix + c)}, "></option>`).join('');
      }
    });
    el.addEventListener('change', () => { d[el.name] = el.value; });
  });
  if (!d.to) $('input[name="to"]', r).focus();

  r.onclick = async (e) => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    if (b.dataset.c === 'cc') {
      d.showCc = true; b.hidden = true;
      r.querySelectorAll('[data-ccrow]').forEach((x) => { x.hidden = false; });
      $('input[name="cc"]', r).focus();
      return;
    }
    if (b.dataset.c === 'discard') {
      if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Tap again to discard'; return; }
      state.draft = null;
      closeReader();
      return;
    }
    if (b.dataset.c === 'send') {
      if (!(d.to + d.cc + d.bcc).trim()) { toast('Add at least one recipient.'); $('input[name="to"]', r).focus(); return; }
      const sendBtns = r.querySelectorAll('[data-c="send"]');
      sendBtns.forEach((x) => { x.disabled = true; x.textContent = 'Sending…'; });
      try {
        const attachments = await Promise.all(d.files.map(async (f) => ({ filename: f.name, contentType: f.type, data: await fileToBase64(f) })));
        await api('/compose', { method: 'POST', body: { acct: d.acct, to: d.to, cc: d.cc, bcc: d.bcc, subject: d.subject, body: d.body, attachments } });
        state.draft = null;
        toast('Sent ✓');
        closeReader();
      } catch (err) {
        toast(err.message);
        sendBtns.forEach((x) => { x.disabled = false; x.textContent = 'Send'; });
      }
    }
  };
}

// ---------- calendar page ----------
const AGENDA_DAYS = 14;

function openAgenda() {
  if (window.innerWidth >= 960) { if (state.current) closeReader(); else showIdleReader(); return; }
  pushLayer('reader');
  state.current = { key: 'agenda', agenda: true };
  $('#reader').classList.add('open');
  renderAgenda($('#reader'), { embedded: false });
}

async function renderAgenda(root, { embedded, start } = {}) {
  const today = localYmd(new Date());
  const from = start || today;
  const to = addDays(from, AGENDA_DAYS);
  const token = Symbol();
  root._agenda = token;
  const top = `<div class="reader-top">
      ${embedded ? '' : '<button class="icon-btn back" aria-label="Back">←</button>'}
      <b style="font-size:17px">📅 Calendar</b><div class="spacer"></div>
      <button class="btn ghost" data-ag="${addDays(from, -AGENDA_DAYS)}" aria-label="Previous two weeks">‹</button>
      <button class="btn ghost" data-ag="${today}">Today</button>
      <button class="btn ghost" data-ag="${to}" aria-label="Next two weeks">›</button>
    </div>`;
  root.innerHTML = `${top}<div class="reader-body"><div class="reader-inner"><p class="muted">Loading your calendars…</p></div></div>`;
  const wire = () => {
    $('.back', root)?.addEventListener('click', () => closeReader());
    root.querySelectorAll('[data-ag]').forEach((b) => b.addEventListener('click', () => renderAgenda(root, { embedded, start: b.dataset.ag })));
  };
  wire();
  let data;
  try {
    data = await api(`/calendar?from=${encodeURIComponent(parseYmd(from).toISOString())}&to=${encodeURIComponent(parseYmd(to).toISOString())}`);
  } catch (err) { data = { events: [], status: {}, error: err.message }; }
  if (root._agenda !== token) return; // the user moved on meanwhile

  const when = (ev) => ev.allDay ? 'All day' : `${hm(new Date(ev.start))}–${hm(new Date(ev.end))}`;
  let html = '';
  for (let d = from; d < to; d = addDays(d, 1)) {
    const evs = data.events.filter((ev) => onDay(ev, d))
      .sort((a, b) => (a.allDay === b.allDay ? (a.start < b.start ? -1 : 1) : a.allDay ? -1 : 1));
    const label = parseYmd(d).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
    html += `<div class="ag-day ${d === today ? 'today' : ''} ${evs.length ? '' : 'free'}">
      <div class="ag-date">${d === today ? 'Today · ' : d === addDays(today, 1) ? 'Tomorrow · ' : ''}${esc(label)}</div>
      ${evs.length ? evs.map((ev) => {
        const a = acctOf(ev.acct);
        return `<div class="ev" style="--acct:${a.color}"><span class="bar"></span><span class="t">${esc(when(ev))}</span>
          <span class="what"><div>${esc(ev.title)}</div><div>${esc([ev.location, /^(calendar|my calendar|calendrier)$/i.test(ev.calendar || '') || ev.calendar === a.email ? '' : ev.calendar, acctLabel(a)].filter(Boolean).join(' · '))}</div></span></div>`;
      }).join('') : '<div class="ag-free">Nothing scheduled</div>'}
    </div>`;
  }
  const notes = Object.entries(data.status || {}).filter(([, v]) => v.error)
    .map(([id, v]) => `<div class="cal-note bad">${esc(acctLabel(acctOf(id)))}: ${esc(v.error)}</div>`).join('')
    + (data.error ? `<div class="cal-note bad">${esc(data.error)}</div>` : '');
  root.innerHTML = `${top}<div class="reader-body"><div class="reader-inner">${notes}${html}</div></div>`;
  wire();
}

function repliedBar(m) {
  if (!m.full?.replied) return '';
  const at = m.full.replied.at;
  return `<div class="replied-bar">↩ You replied${at ? ' on ' + esc(fmtLong(at)) : ''}
    ${m.full.replied.uid ? `<button class="btn ghost" data-act="myreply">Show my reply</button>` : ''}</div>`;
}

function frameDoc(html, showImages) {
  const img = showImages ? 'data: cid: https: http:' : 'data: cid:';
  return `<!doctype html><html><head><meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https:; img-src ${img}; font-src data: https:;">
    <base target="_blank">
    <style>
      html{-webkit-text-size-adjust:100%;overflow:hidden}
      body{margin:12px;font:15px/1.5 system-ui,sans-serif;color:#161a23;background:#fff;overflow-wrap:anywhere}
      img,video{max-width:100%!important;height:auto!important}
      table{max-width:100%!important}
      pre{white-space:pre-wrap}
    </style>
    </head><body>${html}</body></html>`;
}

const isMe = (conv, m) => m.meta.box === 'sent';
const recipientsOf = (m) => (m.full ? [...m.full.to, ...m.full.cc] : m.meta.to || []);

function messageHtml(conv, m, idx) {
  const a = acctOf(conv.acct);
  const meta = m.meta;
  const who = isMe(conv, m) ? 'Me' : (meta.from?.name || meta.from?.address || 'Unknown');
  const isTarget = conv.target === m;
  const head = `<div class="tm-head" data-toggle="${idx}">
      <div class="avatar" style="--acct:${isMe(conv, m) ? 'var(--muted)' : a.color}">${esc(isMe(conv, m) ? 'Me' : initials(meta.from))}</div>
      <div class="tm-who"><b>${esc(who)}</b>${isMe(conv, m) && meta.to?.length ? ` <span class="muted">to ${esc(meta.to.map(shortName).join(', '))}</span>` : ''}
        ${m.open ? '' : `<div class="tm-prev">${esc(meta.preview || '')}</div>`}</div>
      <div class="tm-when">${esc(fmtLong(meta.date))}</div>
    </div>`;
  if (!m.open) return `<div class="tmsg ${isMe(conv, m) ? 'mine' : ''} ${isTarget ? 'target' : ''}" data-idx="${idx}">${head}</div>`;

  let body;
  if (!m.full) body = `<p class="muted" style="padding:4px 0">Loading…</p>`;
  else if (m.full.error) body = `<p class="err">${esc(m.full.error)}</p>`;
  else {
    const f = m.full;
    const hasRemote = f.html && /<img[^>]+src=["']?https?:/i.test(f.html);
    body = `<div class="muted tm-to">to ${esc(f.to.map(fmtAddr).join(', '))}${f.cc.length ? ' · cc ' + esc(f.cc.map(fmtAddr).join(', ')) : ''}</div>
      ${conv.msgs.length === 1 ? repliedBar(m) : ''}
      ${hasRemote && !m.showImages ? `<div class="img-note">Images from the internet are hidden to protect your privacy.<button class="btn ghost" data-act="images" data-idx="${idx}">Show images</button></div>` : ''}
      ${f.html
        ? `<div class="msg-frame-wrap"><iframe class="msg-frame" data-frame="${idx}" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe></div>`
        : `<div class="msg-text">${linkify(f.text)}</div>`}
      ${f.attachments.length ? `<div class="atts">${f.attachments.map((x) =>
        `<a class="att" href="/api${msgUrl(f, '/att/' + x.idx)}">📎 ${esc(x.filename)} <span style="color:var(--muted)">${fmtSize(x.size)}</span></a>`).join('')}</div>` : ''}`;
  }
  const many = recipientsOf(m).length > 1;
  const single = conv.msgs.length === 1; // the bottom bar is enough then
  const actions = m.full && !m.full.error ? `<div class="tm-actions">
      ${single ? '' : `<button class="btn ghost" data-act="replyto" data-idx="${idx}">↩ Reply to this</button>`}
      ${single || !many ? '' : `<button class="btn ghost" data-act="replyall" data-idx="${idx}">↩ Reply all to this</button>`}
      ${m.meta.box === 'inbox' && m.meta.uid ? `<span class="spacer"></span><button class="btn danger" data-act="delete" data-idx="${idx}">Delete</button>` : ''}
    </div>` : '';
  return `<div class="tmsg open ${isMe(conv, m) ? 'mine' : ''} ${isTarget ? 'target' : ''}" data-idx="${idx}">${head}<div class="tm-body">${body}</div>${actions}</div>`;
}

function renderConversation(conv) {
  const hasCal = state.accounts.some((x) => x.calendar);
  const r = $('#reader');
  const subject = conv.msgs[conv.msgs.length - 1]?.meta.subject || '';
  r.innerHTML = `
    <div class="reader-top">
      <button class="icon-btn back" aria-label="Back">←</button>
      <div class="spacer"></div>
      <button class="btn ghost focus-btn" data-act="focus" title="Hide the feed to read on the whole screen (Esc)">${state.focus ? '⤡ Show feed' : '⤢ Focus'}</button>
      <button class="btn ghost" data-act="unread">Mark unread</button>
    </div>
    <div class="reader-body"><div class="reader-inner">
      <h2>${esc(subject)}</h2>
      <div class="reader-grid"><div class="msg-col">
      <div id="thread"></div>
    </div>${hasCal ? '<details class="cal" id="calPanel"></details>' : ''}</div></div></div>
    <div class="composer collapsed">
      <button class="reply-stub" data-act="expand" id="replyStub">↩ Reply…</button>
      <div class="reply-target" id="replyTarget"></div>
      <textarea id="replyText" placeholder="Write a reply…"></textarea>
      <div class="files" id="replyFiles"></div>
      <div class="actions">
        <label class="btn ghost" style="padding:8px 12px" title="Attach files">📎 Attach<input type="file" id="replyFileInput" multiple hidden></label>
        <div class="to" id="replyTo"></div>
        <label id="replyAllWrap" style="font-size:13px;display:none;gap:6px;align-items:center"><input type="checkbox" id="replyAll"> Reply all</label>
        <button class="btn" data-act="send">Send</button>
      </div>
    </div>`;
  $('.back', r).onclick = () => closeReader();
  applyFocus();
  renderThread(conv);
  setupComposer(conv);
  for (const m of conv.msgs) if (m.open && !m.full) loadFull(conv, m);
}

function renderThread(conv) {
  const t = $('#thread');
  if (!t) return;
  t.innerHTML = conv.msgs.map((m, i) => messageHtml(conv, m, i)).join('');
  t.querySelectorAll('[data-frame]').forEach((frame) => {
    const m = conv.msgs[Number(frame.dataset.frame)];
    // Emails built for 600-700px wide screens get zoomed out to fit (like
    // Gmail's auto-fit); then the frame grows to the email's full height.
    const fit = () => {
      try {
        const doc = frame.contentDocument;
        const body = doc.body;
        body.style.zoom = '';
        const avail = frame.clientWidth;
        const wide = Math.max(doc.documentElement.scrollWidth, body.scrollWidth);
        // A little slack so rounding never leaves the email a pixel too wide.
        if (wide > avail) body.style.zoom = String(Math.max(0.3, (avail - 4) / wide));
        frame.style.height = (doc.documentElement.scrollHeight + 4) + 'px';
      } catch {}
    };
    frame.addEventListener('load', () => {
      fit();
      frame.contentDocument?.querySelectorAll('img').forEach((img) => img.addEventListener('load', fit));
      setTimeout(fit, 500);
      setTimeout(fit, 1500);
    });
    frame.srcdoc = frameDoc(m.full.html, m.showImages);
  });
  updateComposerTarget(conv);
}

async function loadFull(conv, m) {
  if (!m.meta.uid) return;
  try {
    const pre = conv.prefetch;
    if (pre && m.meta.box === 'inbox' && String(pre.uid) === String(m.meta.uid)) {
      conv.prefetch = null;
      m.full = await pre.promise;
    } else {
      m.full = await api(msgUrl({ ...m.meta, acct: conv.acct }));
    }
  } catch (err) { m.full = { error: err.message }; }
  if (state.current !== conv) return;
  renderThread(conv);
  // The calendar follows the newest message from someone else.
  const newestInbox = [...conv.msgs].reverse().find((x) => x.meta.box === 'inbox' && x.full && !x.full.error);
  if (newestInbox && !conv.calSet && $('#calPanel')) { conv.calSet = true; setupCalendar(newestInbox.full); }
}

function updateComposerTarget(conv) {
  const m = conv.target;
  if (!m || !$('#replyTarget')) return;
  const last = conv.msgs[conv.msgs.length - 1];
  const who = isMe(conv, m) ? `my message to ${(m.meta.to || []).map(shortName).join(', ')}` : shortName(m.meta.from);
  $('#replyTarget').innerHTML = conv.msgs.length > 1
    ? `<span>↩ Replying to <b>${esc(who)}</b> · ${esc(fmtLong(m.meta.date))}</span>${m !== last ? `<button class="x" data-act="untarget" aria-label="Reply to the latest message instead">✕</button>` : ''}`
    : '';
  const to = isMe(conv, m) ? (m.full?.to || m.meta.to || []) : [m.full?.from || m.meta.from].filter(Boolean);
  $('#replyTo').textContent = `To ${to.map(fmtAddr).join(', ')}`;
  const whoTo = isMe(conv, m) ? (m.meta.to || []).map(shortName).join(', ') : shortName(m.meta.from);
  $('#replyStub').textContent = conv.msgs.length > 1
    ? `↩ Reply to ${whoTo} · ${m === last ? 'latest' : fmtLong(m.meta.date)}…`
    : `↩ Reply to ${whoTo}…`;
  $('#replyAllWrap').style.display = recipientsOf(m).length > 1 ? 'flex' : 'none';
}

function setupComposer(conv) {
  const r = $('#reader');
  const files = [];
  const renderFiles = () => {
    $('#replyFiles').innerHTML = files.map((f, i) => `<div class="f"><span>📎 ${esc(f.name)}</span> <small style="color:var(--muted)">${fmtSize(f.size)}</small><button data-rmfile="${i}" aria-label="Remove">×</button></div>`).join('');
  };
  $('#replyFileInput').addEventListener('change', (e) => {
    for (const f of e.target.files) files.push(f);
    e.target.value = '';
    if (files.reduce((n, f) => n + f.size, 0) > 20 * 1024 * 1024) toast('Attachments are over 20 MB in total; most mail servers will refuse them.');
    renderFiles();
  });
  $('#replyFiles').addEventListener('click', (e) => {
    const x = e.target.closest('[data-rmfile]'); if (!x) return;
    files.splice(Number(x.dataset.rmfile), 1); renderFiles();
  });
  const composer = $('.composer', r);
  const expand = () => { composer.classList.remove('collapsed'); $('#replyText').focus(); };
  const collapseIfEmpty = () => {
    if (!$('#replyText').value.trim() && !files.length) composer.classList.add('collapsed');
  };
  $('#replyText').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('[data-act="send"]', r).click();
    if (e.key === 'Escape') { e.stopPropagation(); collapseIfEmpty(); $('#replyText').blur(); }
  });

  r.onclick = async (e) => {
    const tog = e.target.closest('[data-toggle]');
    if (tog && !e.target.closest('a,button')) {
      const m = conv.msgs[Number(tog.dataset.toggle)];
      m.open = !m.open;
      renderThread(conv);
      if (m.open && !m.full) loadFull(conv, m);
      return;
    }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    const m = b.dataset.idx !== undefined ? conv.msgs[Number(b.dataset.idx)] : null;
    if (act === 'images') { m.showImages = true; return renderThread(conv); }
    if (act === 'expand') return expand();
    if (act === 'focus') return toggleFocus();
    if (act === 'replyto' || act === 'replyall') {
      conv.target = m;
      renderThread(conv);
      $('#replyAll').checked = act === 'replyall';
      expand();
      return;
    }
    if (act === 'untarget') { conv.target = conv.msgs[conv.msgs.length - 1]; $('#replyAll').checked = false; return renderThread(conv); }
    if (act === 'myreply') {
      const bar = b.closest('.replied-bar');
      const open = $('.my-reply', bar);
      if (open) { open.remove(); b.textContent = 'Show my reply'; return; }
      b.disabled = true;
      try {
        const only = conv.msgs[0];
        const rr = await api(`/sent/${conv.acct}/${encodeURIComponent(only.full.replied.uid)}`);
        bar.insertAdjacentHTML('beforeend', `<div class="my-reply">${linkify(rr.text || '(empty)')}</div>`);
        b.textContent = 'Hide my reply';
      } catch (err) { toast(err.message); }
      b.disabled = false;
      return;
    }
    if (act === 'unread') {
      const latest = [...conv.msgs].reverse().find((x) => x.meta.box === 'inbox' && x.meta.uid);
      if (!latest) return;
      await api(`/msg/${conv.acct}/${encodeURIComponent(latest.meta.uid)}/seen`, { method: 'POST', body: { seen: false } }).catch((err) => toast(err.message));
      const it = state.items.find((i) => i.acct === conv.acct && i.uid === latest.meta.uid);
      if (it) it.seen = false;
      renderChips(); closeReader(); return;
    }
    if (act === 'delete') {
      if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Tap again to delete'; return; }
      b.disabled = true;
      try {
        await api(`/msg/${conv.acct}/${encodeURIComponent(m.meta.uid)}`, { method: 'DELETE' });
        state.items = state.items.filter((i) => !(i.acct === conv.acct && i.uid === m.meta.uid));
        conv.msgs = conv.msgs.filter((x) => x !== m);
        renderChips(); toast('Moved to Trash');
        if (!conv.msgs.length) return closeReader();
        if (conv.target === m) conv.target = conv.msgs[conv.msgs.length - 1];
        renderThread(conv); renderFeed();
      } catch (err) { toast(err.message); b.disabled = false; }
      return;
    }
    if (act === 'send') {
      const body = $('#replyText').value.trim();
      if (!body) return $('#replyText').focus();
      const t = conv.target;
      b.disabled = true; b.textContent = 'Sending…';
      try {
        const attachments = await Promise.all(files.map(async (f) => ({ filename: f.name, contentType: f.type, data: await fileToBase64(f) })));
        await api(`/msg/${conv.acct}/${encodeURIComponent(t.meta.uid)}/reply${t.meta.box === 'sent' ? '?box=sent' : ''}`,
          { method: 'POST', body: { body, all: !!$('#replyAll').checked, attachments } });
        $('#replyText').value = '';
        files.length = 0; renderFiles();
        composer.classList.add('collapsed');
        const now = new Date().toISOString();
        if (t.meta.box === 'inbox') {
          const it = state.items.find((i) => i.acct === conv.acct && i.uid === t.meta.uid);
          if (it) { it.answered = true; it.replied = { at: now, uid: null }; }
          if (t.full) t.full.replied = { at: now, uid: null };
        }
        // Show what I just sent at the end of the conversation.
        const acct = acctOf(conv.acct);
        const to = isMe(conv, t) ? (t.full?.to || t.meta.to || []) : [t.full?.from || t.meta.from].filter(Boolean);
        const sent = { meta: { box: 'sent', uid: null, date: now, from: { name: acct.name || '', address: acct.email }, to, subject: t.meta.subject, preview: body },
          full: { box: 'sent', acct: conv.acct, to, cc: [], html: null, text: body, attachments: [], from: null }, open: true };
        conv.msgs.push(sent);
        conv.target = [...conv.msgs].reverse().find((x) => x.meta.uid) || t;
        $('#replyAll').checked = false;
        renderThread(conv); renderFeed(); toast('Reply sent');
      } catch (err) { toast(err.message); }
      b.disabled = false; b.textContent = 'Send';
    }
  };
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
    fr.onerror = () => reject(new Error('Could not read ' + file.name));
    fr.readAsDataURL(file);
  });
}

// ---------- touch gestures ----------
// Swipe in from the left edge to go back (iPhones have no system back gesture;
// on Android the system gesture already works through history).
(() => {
  const r = $('#reader');
  let x0 = null, y0 = 0, dx = 0;
  r.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    if (!state.current || window.innerWidth >= 960 || t.clientX > 24) return;
    x0 = t.clientX; y0 = t.clientY; dx = 0;
  }, { passive: true });
  r.addEventListener('touchmove', (e) => {
    if (x0 === null) return;
    const t = e.touches[0];
    dx = t.clientX - x0;
    if (Math.abs(t.clientY - y0) > Math.abs(dx)) { x0 = null; r.style.transform = ''; return; }
    if (dx > 0) r.style.transform = `translateX(${dx}px)`;
  }, { passive: true });
  r.addEventListener('touchend', () => {
    if (x0 === null) return;
    x0 = null;
    r.style.transition = 'transform .18s ease-out';
    if (dx > 90) {
      r.style.transform = 'translateX(100%)';
      setTimeout(() => { r.style.transition = ''; r.style.transform = ''; closeReader(); }, 180);
    } else {
      r.style.transform = '';
      setTimeout(() => { r.style.transition = ''; }, 180);
    }
  });
})();

// Pull down at the top of the feed to refresh.
(() => {
  const feed = $('#feed');
  const ptr = $('#ptr');
  const PULL = 70;
  let y0 = null, dy = 0;
  const show = (h, text) => { ptr.style.height = h + 'px'; ptr.textContent = text; };
  feed.addEventListener('touchstart', (e) => {
    if (feed.scrollTop > 0 || state.loading) return;
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  feed.addEventListener('touchmove', (e) => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || feed.scrollTop > 0) { show(0, ''); return; }
    const h = Math.min(90, dy * 0.5);
    show(h, h >= PULL * 0.5 + 10 ? '↻ Release to refresh' : '↓ Pull to refresh');
  }, { passive: true });
  feed.addEventListener('touchend', async () => {
    if (y0 === null) return;
    y0 = null;
    if (dy * 0.5 >= PULL * 0.5 + 10) {
      const before = new Set(state.items.map((i) => i.id));
      ptr.innerHTML = '<span class="ptr-spin">↻</span> Checking all inboxes…';
      ptr.style.height = '48px';
      while (state.loading) await new Promise((r) => setTimeout(r, 200));
      await loadFeed(true);
      const fresh = state.items.filter((i) => !before.has(i.id)).length;
      show(48, fresh ? `✓ ${fresh} new` : '✓ Updated');
      await new Promise((r) => setTimeout(r, 1200));
    }
    show(0, '');
  });
})();

// ---------- calendar panel ----------
const pad2 = (n) => String(n).padStart(2, '0');
const localYmd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return localYmd(d); };
const hm = (d) => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const dayName = (s) => {
  const t = localYmd(new Date());
  if (s === t) return 'Today';
  if (s === addDays(t, 1)) return 'Tomorrow';
  return parseYmd(s).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
};
const inviteDay = (inv) => (inv.allDay ? inv.start : localYmd(new Date(inv.start)));

// Does an event (timed or all-day) touch the given local day?
function onDay(ev, day) {
  if (ev.allDay) return ev.start <= day && day < (ev.end > ev.start ? ev.end : addDays(ev.start, 1));
  const s = new Date(ev.start), e = new Date(ev.end), d0 = parseYmd(day), d1 = parseYmd(addDays(day, 1));
  return e > d0 && s < d1;
}
function overlaps(a, b) {
  if (a.allDay || b.allDay) return false;
  return new Date(a.start) < new Date(b.end) && new Date(b.start) < new Date(a.end);
}

function setupCalendar(msg) {
  const inv = msg.invite && msg.invite.start ? msg.invite : null;
  const today = localYmd(new Date());
  const tabs = [];
  if (inv) tabs.push({ day: inviteDay(inv), label: 'Invite' });
  for (const d of msg.dates || []) if (d.date >= today) tabs.push({ day: d.date, label: d.text });
  tabs.push({ day: today, label: '' });
  const uniq = tabs.filter((t, i) => tabs.findIndex((x) => x.day === t.day) === i);
  const cs = { msg, inv, tabs: uniq, day: uniq[0].day, rsvp: null };
  const panel = $('#calPanel');
  panel.open = !!inv; // dates only show in the one-line summary until tapped
  state.calKeep = panel;
  panel._cs = cs;
  panel.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-day]');
    if (t) { e.preventDefault(); cs.day = t.dataset.day; return loadCalDay(panel); }
    const r = e.target.closest('[data-rsvp]');
    if (r) { e.preventDefault(); return sendRsvp(panel, r.dataset.rsvp); }
  });
  loadCalDay(panel);
}

async function loadCalDay(panel) {
  const cs = panel._cs;
  const day = cs.day;
  renderCal(panel, null);
  const from = parseYmd(day), to = parseYmd(addDays(day, 1));
  try {
    const data = await api(`/calendar?from=${encodeURIComponent(from.toISOString())}&to=${encodeURIComponent(to.toISOString())}`);
    if (cs.day !== day) return;
    renderCal(panel, data);
  } catch (err) {
    if (cs.day === day) renderCal(panel, { events: [], status: {}, error: err.message });
  }
}

function renderCal(panel, data) {
  const cs = panel._cs;
  const { inv, day } = cs;
  const events = data ? data.events.filter((ev) => onDay(ev, day)) : [];
  const invHere = inv && onDay(inv, day);
  const already = invHere && events.some((ev) => ev.uid === inv.uid);
  const shown = events.filter((ev) => !(invHere && ev.uid === inv.uid && !already));
  const clashes = invHere ? shown.filter((ev) => ev.uid !== inv.uid && overlaps(ev, inv)) : [];

  const summarySub = !data ? 'Loading…'
    : clashes.length ? `${dayName(day)} · ${clashes.length} clash${clashes.length > 1 ? 'es' : ''}`
    : `${dayName(day)} · ${shown.length ? shown.length + ' event' + (shown.length > 1 ? 's' : '') : 'free'}`;

  const tabsHtml = cs.tabs.length > 1 || !cs.tabs.some((t) => t.day === day)
    ? `<div class="cal-days">${cs.tabs.map((t) => `<button class="chip ${t.day === day ? 'on' : ''}" data-day="${t.day}">${esc(dayName(t.day))}${t.label ? ` <small>${esc(t.label)}</small>` : ''}</button>`).join('')}</div>` : '';

  const when = (ev) => ev.allDay ? 'All day' : `${hm(new Date(ev.start))}–${hm(new Date(ev.end))}`;
  const inviteHtml = invHere ? `<div class="invite">
      <div class="lbl">${inv.method === 'CANCEL' ? 'Cancelled' : 'Invitation'}${already ? ' · in your calendar' : ''}</div>
      <div class="ttl">${esc(inv.title)}</div>
      <div class="muted">${esc(when(inv))}${inv.location ? ' · ' + esc(inv.location) : ''}${inv.recurring ? ' · repeats' : ''}</div>
      ${inv.organizer ? `<div class="muted">from ${esc(inv.organizer.name || inv.organizer.address)}</div>` : ''}
      ${inv.method === 'REQUEST' ? (cs.rsvp
        ? `<div class="cal-note ${cs.rsvp.bad ? 'bad' : ''}">${esc(cs.rsvp.text)}</div>`
        : `<div class="rsvp"><button class="btn" data-rsvp="ACCEPTED">Accept</button><button class="btn ghost" data-rsvp="TENTATIVE">Maybe</button><button class="btn danger" data-rsvp="DECLINED">Decline</button></div>`) : ''}
    </div>` : '';

  const evHtml = !data ? `<div class="ev free">Loading your calendars…</div>`
    : shown.length ? shown.map((ev) => {
        const a = acctOf(ev.acct);
        const clash = clashes.includes(ev);
        return `<div class="ev ${clash ? 'clash' : ''}" style="--acct:${a.color}"><span class="bar"></span>
          <span class="t">${esc(when(ev))}</span>
          <span class="what"><div>${esc(ev.title)}</div><div>${esc([ev.location, acctLabel(a)].filter(Boolean).join(' · '))}</div></span></div>`;
      }).join('')
    : `<div class="ev free">Nothing scheduled${invHere ? ' — you are free' : ''}.</div>`;

  const notes = data ? Object.entries(data.status || {}).filter(([, v]) => v.error)
    .map(([id, v]) => `<div class="cal-note bad">${esc(acctLabel(acctOf(id)))}: ${esc(v.error)}</div>`).join('')
    + (data.error ? `<div class="cal-note bad">${esc(data.error)}</div>` : '') : '';

  panel.innerHTML = `<summary>📅 Calendar <span class="sum-sub ${clashes.length ? 'clash' : ''}">${esc(summarySub)}</span></summary>
    <div class="cal-body">
      ${tabsHtml}
      <div class="cal-nav"><button data-day="${addDays(day, -1)}" aria-label="Previous day">‹</button>
        <b>${esc(parseYmd(day).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' }))}</b>
        <button data-day="${addDays(day, 1)}" aria-label="Next day">›</button></div>
      ${inviteHtml}
      <div>${evHtml}</div>
      ${notes}
    </div>`;
}

async function sendRsvp(panel, response) {
  const cs = panel._cs;
  panel.querySelectorAll('[data-rsvp]').forEach((b) => { b.disabled = true; });
  try {
    const r = await api(`/msg/${cs.msg.acct}/${encodeURIComponent(cs.msg.uid)}/rsvp`, { method: 'POST', body: { response } });
    const word = { ACCEPTED: 'Accepted', TENTATIVE: 'Answered maybe', DECLINED: 'Declined' }[response];
    cs.rsvp = { text: `${word} — the organizer has been told.` + (r.savedTo ? ` Added to ${r.savedTo}.` : '') + (r.calendarError ? ` (Could not add to calendar: ${r.calendarError})` : ''), bad: !!r.calendarError };
    toast(word + ' ✓');
  } catch (err) {
    cs.rsvp = null;
    toast(err.message);
  }
  loadCalDay(panel);
}

// ---------- settings ----------
async function openSettings() {
  const providers = await api('/providers');
  const back = document.createElement('div');
  back.className = 'sheet-back';
  pushLayer('sheet');
  back._close = (fromHistory = false) => {
    if (!fromHistory && !popLayer('sheet')) return;
    back.remove();
    loadFeed(true);
  };
  let color = COLORS[state.accounts.length % COLORS.length];
  back.innerHTML = `<div class="sheet" role="dialog" aria-label="Accounts">
    <div style="display:flex;align-items:center"><h2 style="flex:1">Accounts</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div id="acctList"></div>
    <h3>Gmail + Google Calendar</h3>
    <div id="googleBox"></div>
    <h3>Outlook / Hotmail + Outlook Calendar</h3>
    <div id="msBox"></div>
    <h3>Add another account</h3>
    <form id="addForm">
      <label class="field"><span>Provider</span><select name="provider">${providers.filter((p) => !p.oauth).map((p) => `<option value="${p.id}">${esc(p.label)}</option>`).join('')}</select></label>
      <div class="hint" id="provHint"></div>
      <label class="field"><span>Email address</span><input name="email" type="email" autocomplete="off" required></label>
      <label class="field"><span>App password</span><input name="password" type="password" autocomplete="new-password" required></label>
      <label class="field"><span>Short name (shown in the feed, optional)</span><input name="name" placeholder="e.g. Yahoo perso"></label>
      <div class="field"><span>Colour</span><div class="colors">${COLORS.map((c) => `<button type="button" data-c="${c}" style="background:${c}" class="${c === color ? 'on' : ''}" aria-label="colour"></button>`).join('')}</div></div>
      <div class="err" id="addErr"></div>
      <button class="btn wide" id="addBtn">Test &amp; add</button>
    </form>
    <h3>This device</h3>
    <button class="btn ghost" data-logout>Log out</button>
    <h3>Raspberry Pi</h3>
    <p class="sub">Shut down before unplugging. To start it again, unplug and plug the power back in.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn danger" data-system="poweroff">Shut down Pi</button>
      <button class="btn ghost" data-system="reboot">Restart Pi</button>
    </div>
  </div>`;
  document.body.append(back);

  const HINTS = {
    yahoo: 'Use a Yahoo <b>app password</b> (Account security → Generate app password), not your normal password.',
    aol: 'Use an AOL <b>app password</b> (Account security → Generate app password), not your normal password.',
    gmx: 'Switch on IMAP first: GMX Settings → POP3 &amp; IMAP → allow access. Use your GMX password, or an app-specific password if you use 2-step login. For the calendar, GMX needs its own application-specific password: add it here after the account is saved.',
  };
  const sel = $('select', back);
  const hint = () => { $('#provHint', back).innerHTML = HINTS[sel.value] || ''; };
  sel.onchange = hint; hint();

  const OAUTH_UI = {
    google: { box: '#googleBox', name: 'Google', idLabel: 'Client ID', idPlaceholder: '….apps.googleusercontent.com', secretLabel: 'Client secret',
      where: 'from your Google Cloud project', warn: "Google will warn that the app isn't verified: choose <b>Advanced → Go to Feed Mail</b>." },
    microsoft: { box: '#msBox', name: 'Microsoft', idLabel: 'Application (client) ID', idPlaceholder: '1234abcd-…', secretLabel: 'Client secret Value',
      where: 'from your Azure app registration (use the secret\'s <b>Value</b>, not its Secret ID)', warn: 'Microsoft will ask you to allow Feed Mail to read and send mail and use your calendar.' },
  };
  const oauthBox = async (kind, forceForm = false) => {
    const ui = OAUTH_UI[kind];
    const g = await api('/' + kind);
    const box = $(ui.box, back);
    if (g.configured && !forceForm) {
      box.innerHTML = `<a class="btn wide" style="display:block;text-align:center;text-decoration:none" href="/oauth/${kind}/start">Sign in with ${ui.name}</a>
        <p class="sub" style="margin-top:8px">${ui.warn} <a href="#" data-keys="${kind}" style="color:var(--accent)">Change ${ui.name} keys</a></p>`;
      return;
    }
    box.innerHTML = `<div class="hint">One-time setup: paste the <b>${ui.idLabel}</b> and <b>${ui.secretLabel}</b> ${ui.where}.
        The redirect URI there must be exactly:<br><code style="word-break:break-all">${esc(g.redirectUri)}</code></div>
      <form data-keysform="${kind}">
        <label class="field"><span>${ui.idLabel}</span><input name="clientId" autocomplete="off" placeholder="${ui.idPlaceholder}" required></label>
        <label class="field"><span>${ui.secretLabel}</span><input name="clientSecret" type="password" autocomplete="off" required></label>
        <div class="err"></div>
        <button class="btn wide">Save ${ui.name} keys</button>
      </form>`;
    $('form', box).addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/' + kind, { method: 'POST', body: Object.fromEntries(new FormData(e.target)) });
        toast(`${ui.name} keys saved ✓`); oauthBox(kind);
      } catch (err) { $('.err', e.target).textContent = err.message; }
    });
  };
  oauthBox('google');
  oauthBox('microsoft');

  const list = () => {
    $('#acctList', back).innerHTML = state.accounts.length
      ? state.accounts.map((a) => `<div class="acct-row"><span class="chip"><span class="dot" style="background:${a.color}"></span></span>
          <div class="info"><div>${esc(acctLabel(a))}</div><div>${esc(a.email)} · ${esc(a.provider.toUpperCase())}</div></div>
          <button class="btn danger" data-del="${a.id}">Remove</button></div>
          ${a.provider === 'gmail' || a.provider === 'outlook' ? `<div style="padding:4px 0 6px"><a class="btn ghost" style="padding:6px 12px;font-size:13px;text-decoration:none;display:inline-block" href="/oauth/${a.provider === 'gmail' ? 'google' : 'microsoft'}/start">Reconnect ${a.provider === 'gmail' ? 'Google' : 'Microsoft'}</a></div>` : ''}
          ${a.calPasswordAllowed ? `<form class="calpw" data-acct="${a.id}" style="display:flex;gap:8px;padding:8px 0 4px;align-items:center">
            <input type="password" name="calPassword" autocomplete="new-password" placeholder="${a.hasCalPassword ? 'Calendar password saved ✓ (type to change)' : 'Calendar password (only if different)'}"
              style="flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)">
            <button class="btn ghost" style="padding:8px 12px">Save</button></form>` : ''}`).join('')
      : `<p class="sub">No accounts yet. Add your first one below.</p>`;
  };
  list();

  back.addEventListener('click', async (e) => {
    if (e.target === back || e.target.closest('[data-close]')) { back._close(); return; }
    const c = e.target.closest('[data-c]');
    if (c) { color = c.dataset.c; back.querySelectorAll('[data-c]').forEach((x) => x.classList.toggle('on', x === c)); return; }
    const del = e.target.closest('[data-del]');
    if (del) {
      if (del.dataset.confirm !== '1') { del.dataset.confirm = '1'; del.textContent = 'Tap again'; return; }
      await api('/accounts/' + del.dataset.del, { method: 'DELETE' });
      state.accounts = state.accounts.filter((a) => a.id !== del.dataset.del);
      state.items = state.items.filter((i) => i.acct !== del.dataset.del);
      list(); renderChips(); renderFeed();
      return;
    }
    const k = e.target.closest('[data-keys]');
    if (k) { e.preventDefault(); oauthBox(k.dataset.keys, true); return; }
    const sys = e.target.closest('[data-system]');
    if (sys) {
      const off = sys.dataset.system === 'poweroff';
      if (sys.dataset.confirm !== '1') { sys.dataset.confirm = '1'; sys.textContent = off ? 'Tap again to shut down' : 'Tap again to restart'; return; }
      sys.disabled = true;
      try {
        await api('/system/' + sys.dataset.system, { method: 'POST' });
        back.querySelector('.sheet').innerHTML = off
          ? `<h2>Shutting down…</h2><p class="sub">Wait about 20 seconds, until the Pi's green light stops flickering. Then it's safe to unplug.<br><br>To start it again: unplug and plug the power back in. Feed Mail is back about a minute later.</p>`
          : `<h2>Restarting…</h2><p class="sub">Feed Mail will be back in about a minute. Reopen or refresh the app then.</p>`;
      } catch (err) { toast(err.message); sys.disabled = false; }
      return;
    }
    if (e.target.closest('[data-logout]')) { await api('/logout', { method: 'POST' }); location.reload(); }
  });

  back.addEventListener('submit', async (e) => {
    const f = e.target.closest('.calpw'); if (!f) return;
    e.preventDefault();
    const btn = $('button', f); btn.disabled = true; btn.textContent = 'Testing…';
    try {
      const updated = await api('/accounts/' + f.dataset.acct, { method: 'PATCH', body: { calPassword: f.calPassword.value } });
      Object.assign(state.accounts.find((a) => a.id === updated.id), updated);
      list(); toast('Calendar connected ✓');
    } catch (err) { toast(err.message); btn.disabled = false; btn.textContent = 'Save'; }
  });

  $('#addForm', back).addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const btn = $('#addBtn', back);
    btn.disabled = true; btn.textContent = 'Testing connection…'; $('#addErr', back).textContent = '';
    try {
      const acct = await api('/accounts', { method: 'POST', body: { ...Object.fromEntries(f), color } });
      state.accounts.push(acct);
      e.target.reset(); hint(); list(); renderChips();
      toast(`Added ✓ ${acct.messages} emails in inbox`);
    } catch (err) { $('#addErr', back).textContent = err.message; }
    btn.disabled = false; btn.textContent = 'Test & add';
  });
}
$('#settingsBtn').onclick = openSettings;
$('#calBtn').onclick = openAgenda;
$('#composeBtn').onclick = openCompose;
$('#viewToggle').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); });
setView(state.view);
$('#refreshBtn').onclick = () => loadFeed(true);

// Keep the feed fresh while the app is open.
setInterval(() => { if (!document.hidden && !$('#app').classList.contains('hidden') && state.accounts.length) loadFeed(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.accounts.length && !$('#app').classList.contains('hidden')) loadFeed(); });

// When the app comes back to the screen, reload if the Pi has a newer version
// (only while on the feed, so nothing you're typing is lost).
(() => {
  let loaded = null;
  const check = async () => {
    try {
      const { v } = await (await fetch('/version', { cache: 'no-store' })).json();
      if (loaded === null) { loaded = v; return; }
      if (v !== loaded && !state.current && !state.draft && !$('.sheet-back')) location.reload();
    } catch {}
  };
  check();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  setInterval(check, 5 * 60 * 1000);
})();

boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
